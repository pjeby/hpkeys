<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- HPKeys tray icon - HP SK-2506U per the real-keyboard photo: blue wrap
       (top strip + side rails, ending above the bottom), single grey deck that
       protrudes below the wrap as the palm rest, main/nav/numpad key sections,
       numpad keys in blue, dot strip and volume knob on the top strip.
       Palette kept from v1: wrap #355CA8, deck/wells greys, keys #EDF0F4. -->
  <g transform="translate(0,4)">
    <!-- white sticker backing (wrap, deck - it protrudes, needs its own rim - and knob) -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round">
      <path stroke-width="9" d="M28 66 H226 Q242 66 242 82 V148 Q242 164 226 166 Q128 174 28 166 Q12 164 12 148 V82 Q12 66 28 66 Z"/>
