      <rect x="195.5" y="119.9" width="6.2" height="9" rx="1.2"/><rect x="203.1" y="119.9" width="6.2" height="9" rx="1.2"/>
      <rect x="210.7" y="119.9" width="6.2" height="9" rx="1.2"/><rect x="218.3" y="119.9" width="6.2" height="9" rx="1.2"/>
